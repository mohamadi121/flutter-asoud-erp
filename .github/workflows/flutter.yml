name: Flutter CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Raster golden baselines are generated on Windows and differ slightly
      # under Linux font rendering. Functional/widget tests still run in CI.
      - run: flutter test --exclude-tags golden
      - name: Build debug APK
        if: github.event_name == 'push'
        run: flutter build apk --debug
      - name: Build release APK
        if: github.event_name == 'push'
        run: flutter build apk --release
      - name: Read application version
        if: github.event_name == 'push'
        id: version
        shell: bash
        run: echo "value=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Upload APK artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: asoud-erp-${{ steps.version.outputs.value }}-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload release APK artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: asoud-erp-${{ steps.version.outputs.value }}-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  # The form builder screens are locked designs: their 360x800 RTL baselines
  # (Vazirmatn and Material icons are loaded from the repository) are checked
  # here. Reported, not blocking, until the baselines have proven stable on the
  # hosted runner; failures upload the diff images.
  form-builder-goldens:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/form_builder_golden_test.dart test/form_builder_golden_s7_test.dart test/form_builder_golden_s10_test.dart
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: form-builder-golden-failures
          path: test/failures
          if-no-files-found: ignore
          retention-days: 7
