name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Raster golden baselines are generated on Windows and differ slightly
      # under Linux font rendering. Functional/widget tests still run in CI.
      - run: flutter test --exclude-tags golden
