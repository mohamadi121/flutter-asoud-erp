name: Flutter CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared/sqlite3
          key: sqlite3-hooks-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            sqlite3-hooks-${{ runner.os }}-
      - run: flutter analyze
      # Raster golden baselines are generated on Windows and differ slightly
      # under Linux font rendering. Functional/widget tests still run in CI.
      - run: |
          set -o pipefail
          out=/tmp/flutter-test.log
          for attempt in 1 2 3 4; do
            if flutter test --exclude-tags golden 2>&1 | tee "$out"; then
              exit 0
            fi
            # Retry only on GitHub release download outages, not on real test failures.
            if ! grep -qE 'Hash of downloaded file|Building native assets failed' "$out"; then
              exit 1
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep 90
            fi
          done
          exit 1
      - name: Build debug APK
        if: github.event_name == 'push'
        run: |
          set -o pipefail
          out=/tmp/flutter-build-debug.log
          for attempt in 1 2 3 4; do
            if flutter build apk --debug 2>&1 | tee "$out"; then
              exit 0
            fi
            # Retry only on GitHub release download outages, not on real build failures.
            if ! grep -qE 'Hash of downloaded file|Building native assets failed' "$out"; then
              exit 1
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep 90
            fi
          done
          exit 1
      - name: Build release APK
        if: github.event_name == 'push'
        run: |
          set -o pipefail
          out=/tmp/flutter-build-release.log
          for attempt in 1 2 3 4; do
            if flutter build apk --release 2>&1 | tee "$out"; then
              exit 0
            fi
            # Retry only on GitHub release download outages, not on real build failures.
            if ! grep -qE 'Hash of downloaded file|Building native assets failed' "$out"; then
              exit 1
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep 90
            fi
          done
          exit 1
      - name: Read application version
        if: github.event_name == 'push'
        id: version
        shell: bash
        run: echo "value=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Upload APK artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: asoud-erp-${{ steps.version.outputs.value }}-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload release APK artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: asoud-erp-${{ steps.version.outputs.value }}-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  # The form builder screens are locked designs: their 360x800 RTL baselines
  # (Vazirmatn and Material icons are loaded from the repository) are checked
  # here. Reported, not blocking, until the baselines have proven stable on the
  # hosted runner; failures upload the diff images.
  form-builder-goldens:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared/sqlite3
          key: sqlite3-hooks-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            sqlite3-hooks-${{ runner.os }}-
      - run: |
          set -o pipefail
          out=/tmp/flutter-golden.log
          for attempt in 1 2 3 4; do
            if flutter test test/form_builder_golden_test.dart test/form_builder_golden_s7_test.dart test/form_builder_golden_s10_test.dart 2>&1 | tee "$out"; then
              exit 0
            fi
            # Retry only on GitHub release download outages, not on real test failures.
            if ! grep -qE 'Hash of downloaded file|Building native assets failed' "$out"; then
              exit 1
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep 90
            fi
          done
          exit 1
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: form-builder-golden-failures
          path: test/failures
          if-no-files-found: ignore
          retention-days: 7
